<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Guardians of the Chronoshard Catacombs: Multiplayer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Alegreya+SC:wght@700;800&display=swap">
<style>
/* Layout concept: a dark game-table. Top tab bar, then one of three views: Play (board left, command rail right), Heroes (card grid), Rules (sequence + assumptions). */
:root {
  --bg: #15121c; --surface: #1f1a2b; --surface2: #2a2338; --line: #3b3252; --fg: #f4efe6; --muted: #b6adc6;
  --gold: #e3b04b; --on-gold: #1b1406; --good: #78c47c; --bad: #ec6d62; --info: #74b0ea; --warn: #e9a23b;
  --hex-green: #2f6b5b; --hex-purple: #5b4a8a; --hex-gold: #a8792c; --hex-red: #a63d2f; --hex-edge: #15121c;
  --f-display: 'Alegreya SC', Georgia, 'Times New Roman', serif;
  --f-body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #efeaf5; --surface: #ffffff; --surface2: #e5ddf0; --line: #cbbfdc; --fg: #1d1828; --muted: #5a5170;
    --gold: #946709; --on-gold: #1b1406; --good: #2f7d36; --bad: #b8342a; --info: #1f6fb5; --warn: #9a5f06;
    --hex-green: #6fb09d; --hex-purple: #a493d4; --hex-gold: #e0b45a; --hex-red: #d9705f; --hex-edge: #efeaf5; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #efeaf5; --surface: #ffffff; --surface2: #e5ddf0; --line: #cbbfdc; --fg: #1d1828; --muted: #5a5170;
  --gold: #946709; --on-gold: #1b1406; --good: #2f7d36; --bad: #b8342a; --info: #1f6fb5; --warn: #9a5f06;
  --hex-green: #6fb09d; --hex-purple: #a493d4; --hex-gold: #e0b45a; --hex-red: #d9705f; --hex-edge: #efeaf5; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.45; padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .02em; }
.wrap { max-width: 1240px; margin: 0 auto; }
a { color: var(--gold); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; padding-block: 18px 14px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.brand h1 { font-size: 1.55rem; line-height: 1.1; }
.brand small { display: block; color: var(--muted); font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { background: transparent; border: 1px solid transparent; padding: 8px 16px; border-radius: 8px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.tab[aria-current="page"] { background: var(--surface2); color: var(--fg); border-color: var(--line); }
.tab:hover { color: var(--fg); }

/* generic bits */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.eyebrow { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.btn { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-weight: 600; min-height: 40px; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.on { outline: 2px solid var(--gold); background: var(--surface); }
.chip { display: inline-block; font-size: .78rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.chip.Tank { color: #e6957f; border-color: currentColor; } .chip.Melee { color: #8bb9ec; border-color: currentColor; }
.chip.Ranged { color: #8ed08a; border-color: currentColor; } .chip.Healer { color: #e3b04b; border-color: currentColor; }
.warn { color: var(--warn); }
.dim { color: var(--muted); }
.bar { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); }
.bar.low > i { background: var(--bad); }
.bar.mid > i { background: var(--warn); }

/* heroes view */
.herogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.hcard { display: grid; grid-template-columns: 132px 1fr; gap: 14px; padding: 14px; }
.hcard img { width: 132px; height: 198px; object-fit: cover; border-radius: 8px; display: block; border: 1px solid var(--line); }
.hcard h3 { font-size: 1.15rem; line-height: 1.15; }
.hcard .sub { color: var(--muted); font-size: .92rem; margin: 2px 0 8px; }
.stbl { border-collapse: collapse; width: 100%; font-size: .92rem; margin: 8px 0; }
.stbl th, .stbl td { text-align: center; padding: 3px 4px; border-bottom: 1px solid var(--line); }
.stbl th:first-child, .stbl td:first-child { text-align: left; color: var(--muted); font-weight: 600; }
.stbl td.cur, .stbl th.cur { background: var(--surface2); color: var(--gold); font-weight: 800; }
.lvbtns { display: flex; gap: 4px; margin: 6px 0; }
.lvbtns button { flex: 1; padding: 4px 0; border: 1px solid var(--line); background: var(--surface2); border-radius: 6px; font-weight: 700; min-height: 32px; }
.lvbtns button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.hcard details { grid-column: 1 / -1; font-size: .93rem; color: var(--muted); }
.hcard summary { cursor: pointer; color: var(--fg); font-weight: 600; }
.skillbox { background: var(--surface2); border-radius: 8px; padding: 8px 10px; font-size: .92rem; margin-top: 6px; }
.skillbox b { color: var(--gold); }
.hcard .wide { grid-column: 1 / -1; }

/* rules view */
.rules { display: grid; gap: 20px; }
.seq { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; counter-reset: s; }
.seq > div { background: var(--surface2); border-radius: 10px; padding: 12px; border: 1px solid var(--line); }
.seq h4 { font-size: 1rem; margin-bottom: 4px; color: var(--gold); }
.seq p { margin: 0; font-size: .93rem; color: var(--muted); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.rules h2 { font-size: 1.35rem; margin-bottom: 8px; }
.rules ul { margin: 6px 0 0; padding-left: 20px; }
.rules li { margin: 3px 0; }
.assume { border-color: var(--warn); }
.tagA { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--warn); font-weight: 800; }
.scroll { overflow-x: auto; }
.cardlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 8px; }
.ecard { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: .9rem; }
.ecard b { font-family: var(--f-display); font-size: 1.02rem; display: block; }
.ecard .pool { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); font-weight: 800; }

/* play: setup */
.setup { display: grid; gap: 18px; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.pickbtn { text-align: left; padding: 0; border: 2px solid var(--line); border-radius: 10px; background: var(--surface2); overflow: hidden; display: grid; }
.pickbtn img { width: 100%; height: 100px; object-fit: cover; display: block; }
.pickbtn div { padding: 6px 8px; font-size: .9rem; line-height: 1.2; }
.pickbtn[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.pickbtn[aria-pressed="false"] img { filter: grayscale(.85) brightness(.7); }
.row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--surface2); border: 0; padding: 8px 14px; font-weight: 600; border-right: 1px solid var(--line); min-height: 40px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }
.tokgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.tokgrid label { display: grid; gap: 2px; font-size: .85rem; color: var(--muted); }
select { font: inherit; background: var(--surface2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; min-height: 38px; }

/* play: table */
.table { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 960px) { .table { grid-template-columns: minmax(0, 1fr); } }
.boardbox { padding: 8px; position: relative; }
.boardtop { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding: 4px 8px 8px; align-items: baseline; }
.boardtop h2 { font-size: 1.2rem; }
svg.board { width: 100%; height: auto; max-height: 76vh; display: block; touch-action: manipulation; }
.hexc { stroke: var(--hex-edge); stroke-width: 1.5; }
.hexc.g { fill: var(--hex-green); } .hexc.p { fill: var(--hex-purple); } .hexc.o { fill: var(--hex-gold); } .hexc.r { fill: var(--hex-red); }
.hl-move { fill: var(--gold); fill-opacity: .55; stroke: var(--gold); stroke-width: 2; cursor: pointer; }
.hl-move:hover { fill-opacity: .9; stroke: #fff; stroke-width: 4; filter: drop-shadow(0 0 6px #fff); }
.tok:hover .ring-atk { stroke: #fff; stroke-width: 6; filter: drop-shadow(0 0 6px var(--bad)); }
.tok:hover .ring-ally { stroke: #fff; stroke-width: 6; filter: drop-shadow(0 0 6px var(--good)); }
.ring-atk { fill: none; stroke: var(--bad); stroke-width: 3.5; }
.ring-ally { fill: none; stroke: var(--good); stroke-width: 3.5; }
.ring-cur { fill: none; stroke: var(--gold); stroke-width: 3; stroke-dasharray: 5 4; }
@media (prefers-reduced-motion: no-preference) { .ring-cur { animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; } @keyframes spin { to { transform: rotate(360deg); } } }
.tok { cursor: pointer; }
.sidelbl { font-family: var(--f-display); font-size: 12px; fill: var(--muted); text-anchor: middle; dominant-baseline: middle; }
.sidelbl.spawn { fill: var(--bad); font-weight: 800; } .sidelbl.entry { fill: var(--good); font-weight: 800; }
.hint { padding: 8px 12px; border-radius: 8px; background: var(--surface2); font-size: .95rem; min-height: 40px; margin: 6px 8px 4px; }
.rail { display: grid; gap: 12px; min-width: 0; }
.cmd { display: grid; gap: 10px; }
.cmdhead { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; }
.cmdhead img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
.cmdhead h3 { font-size: 1.1rem; line-height: 1.15; }
.pips { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.pip { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--line); background: transparent; }
.pip.f { background: var(--gold); border-color: var(--gold); }
.pip.e { background: var(--info); border-color: var(--info); }
.statline { display: flex; gap: 4px 10px; font-size: .92rem; flex-wrap: wrap; }
.statline b { color: var(--gold); }
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.actions .btn { text-align: left; line-height: 1.2; }
.actions .btn small { display: block; color: var(--muted); font-weight: 500; font-size: .76rem; }
.actions .full { grid-column: 1 / -1; }
.order { display: grid; gap: 4px; }
.orow { display: grid; grid-template-columns: 30px 1fr auto auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 8px; font-size: .92rem; }
.orow.now { background: var(--surface2); outline: 1px solid var(--gold); }
.orow.down { opacity: .45; text-decoration: line-through; }
.orow img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
.orow .mini { display: flex; gap: 2px; }
.orow .mini button { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); background: var(--surface2); border-radius: 5px; line-height: 1; min-height: 0; }
.itok { font-size: .75rem; color: var(--gold); font-weight: 800; letter-spacing: .04em; }
.enemies { display: grid; gap: 6px; font-size: .9rem; }
.erow { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
.erow .bar { grid-column: 1 / -1; height: 6px; }
.ecardshow { display: grid; gap: 6px; }
.dice { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; font-weight: 800; font-size: 1.1rem; border: 2px solid var(--line); }
.dice.ok { border-color: var(--good); color: var(--good); } .dice.no { border-color: var(--bad); color: var(--bad); }
.log { max-height: 240px; overflow: auto; font-size: .9rem; display: grid; gap: 3px; padding-right: 4px; }
.log div { padding-left: 8px; border-left: 3px solid var(--line); }
.log .hit { border-color: var(--gold); } .log .bad { border-color: var(--bad); color: var(--fg); } .log .good { border-color: var(--good); }
.log .enemy { border-color: var(--warn); } .log .turn { border-color: var(--info); font-weight: 700; } .log .major { border-color: var(--gold); font-weight: 800; }
.log .energy { border-color: var(--info); } .log .dim { color: var(--muted); } .log .skill { border-color: var(--gold); font-weight: 700; }
.banner { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--gold); margin: 6px 8px 4px; }
.banner h3 { font-size: 1.1rem; }
.endscreen { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
.endscreen h2 { font-size: 2rem; }
.foot { margin-top: 28px; color: var(--muted); font-size: .88rem; }
@media (max-width: 520px) { .hcard { grid-template-columns: 96px 1fr; } .hcard img { width: 96px; height: 144px; } .brand h1 { font-size: 1.3rem; } }
.deckrow { margin-top: 10px; display: grid; gap: 6px; }
.deckcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.deckcard { text-align: left; display: grid; gap: 3px; background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .85rem; line-height: 1.3; color: var(--fg); }
.deckcard b { color: var(--gold); font-size: .95rem; }
.deckcard[aria-pressed="true"] { border: 2px solid var(--gold); padding: 7px 9px; }

/* 3D stage */
.stage3d { position: relative; width: 100%; aspect-ratio: 5 / 4; max-height: 76vh; min-height: 320px; border-radius: 10px; overflow: hidden; background: #100d17; border: 1px solid var(--line); }
.stage3d canvas { width: 100%; height: 100%; display: block; cursor: grab; }
.stage3d canvas:active { cursor: grabbing; }
.tip3d { position: absolute; pointer-events: none; background: rgba(21,18,28,.92); color: #f4efe6; border: 1px solid #3b3252; border-radius: 6px; padding: 4px 9px; font-size: .88rem; white-space: nowrap; max-width: 90%; z-index: 3; }
.hint3d { position: absolute; left: 10px; bottom: 8px; right: 10px; color: #d6cfe6; font-size: .82rem; pointer-events: none; text-shadow: 0 1px 3px #000; transition: opacity .6s; opacity: .85; }
.reset3d { position: absolute; top: 8px; right: 8px; z-index: 2; }
.btn.tiny { min-height: 0; padding: 3px 10px; font-size: .82rem; margin-left: 6px; }
@media (max-width: 640px) { .stage3d { aspect-ratio: 1 / 1; min-height: 300px; } }

/* ===================== v2: gate, menu, full-screen world ===================== */
body.lock { overflow: hidden; padding: 0; }
body.lock #app { position: fixed; inset: 0; }
@keyframes spin360 { to { transform: rotate(360deg); } }
@keyframes pulseglow { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }

/* password gate */
.gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #2a1a4a 0%, #120c24 55%, #07050f 100%); }
.gatebg i { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 2px dashed rgba(227,176,75,.28); animation: spin360 90s linear infinite; }
.gatebg i:nth-child(1) { width: 70vmin; height: 70vmin; margin: -35vmin; }
.gatebg i:nth-child(2) { width: 105vmin; height: 105vmin; margin: -52.5vmin; animation-duration: 140s; animation-direction: reverse; border-color: rgba(150,120,255,.25); }
.gatebg i:nth-child(3) { width: 150vmin; height: 150vmin; margin: -75vmin; animation-duration: 220s; border-style: dotted; }
.gatebox { position: relative; display: grid; gap: 12px; justify-items: center; text-align: center; width: min(100%, 420px); padding: 28px 24px 24px; border-radius: 16px; background: rgba(18,12,32,.82); border: 1px solid rgba(227,176,75,.4); box-shadow: 0 0 60px rgba(150,110,255,.25), 0 20px 60px rgba(0,0,0,.6); backdrop-filter: blur(6px); }
.gatebox.shake { animation: shake .4s; }
.gatebox h1 { font-size: clamp(1.4rem, 5vw, 1.9rem); line-height: 1.15; color: var(--gold); }
.gshard { width: 54px; height: 86px; background: linear-gradient(160deg, #fff3c8, #b89cff 45%, #6a3fe0); clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%); filter: drop-shadow(0 0 14px #9a7aff); animation: pulseglow 3s ease-in-out infinite; }
.gatebox input { width: 100%; font: inherit; font-size: 1.1rem; text-align: center; letter-spacing: .12em; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0d0a18; color: var(--fg); }
.gatebox input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 2px rgba(227,176,75,.35); }
.gatebox .btn { width: 100%; font-size: 1.05rem; min-height: 46px; }
.gerr { min-height: 1.3em; margin: 0; color: var(--bad); font-size: .95rem; }

/* main menu */
.menuscreen { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #2b1b52 0%, #120c24 55%, #07050f 100%); }
.menuslot, .menufb { position: absolute; inset: 0; }
.menufb { display: grid; place-items: center; }
.fbclock { position: absolute; width: 80vmin; height: 80vmin; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,226,160,.5) 0 .6deg, transparent .6deg 7.5deg); -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%, #000 66%, transparent 67%); mask: radial-gradient(circle, transparent 62%, #000 63%, #000 66%, transparent 67%); animation: spin360 120s linear infinite; }
.fbshard { width: 14vmin; height: 24vmin; background: linear-gradient(160deg, #fff3c8, #b89cff 45%, #6a3fe0); clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%); filter: drop-shadow(0 0 3vmin #9a7aff); animation: pulseglow 3.2s ease-in-out infinite; }
.orb { position: absolute; width: 11vmin; height: 11vmin; border-radius: 50%; object-fit: cover; border: 2px solid rgba(227,176,75,.7); box-shadow: 0 0 18px rgba(150,110,255,.55); animation: orbit 70s linear infinite; }
@keyframes orbit { from { transform: rotate(calc(var(--i) * 45deg)) translateY(-31vmin) rotate(calc(var(--i) * -45deg)); } to { transform: rotate(calc(var(--i) * 45deg + 360deg)) translateY(-31vmin) rotate(calc(var(--i) * -45deg - 360deg)); } }
.menuvig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(4,2,10,.65) 100%), linear-gradient(to bottom, rgba(4,2,10,.55) 0, transparent 30%, transparent 70%, rgba(4,2,10,.6) 100%); }
.menucontent { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 3.5vh 16px 6vh; pointer-events: none; text-align: center; }
.menucontent .eyebrow { color: #e8dcff; text-shadow: 0 1px 8px #000; }
.gtitle { display: grid; gap: 0; line-height: 1; margin-top: 4px; text-shadow: 0 2px 18px rgba(0,0,0,.8); }
.gtitle span { font-size: clamp(1rem, 3.2vw, 2rem); letter-spacing: .28em; text-transform: uppercase; color: #efe6ff; }

<script>window.HEROES=[{"id": "kenji", "title": "Kenji Kurogane the Flame-Bound", "cls": "Gunmetal Samurai", "role": "Tank", "slot": "Tank 1", "range": 1, "energy": "Fire Charge", "color": "#c8553d", "atk": [2, 3, 3, 3, 4], "mov": [2, 2, 2, 3, 3], "def": [4, 4, 5, 6, 6], "hp": [20, 25, 30, 40, 50], "ability": "Gunmetal Advantage Roll (reaction): when attacked by more than your base defense, spend 1 Fire Charge to roll two defense dice. If either succeeds it is a regular block; if both succeed, your block power is doubled.", "bg": "The samurai’s ways never dwindle no matter if it's the Edo Period or 2068 A.C when technology and weaponry has advanced past the now ancient Katana. Little is known who started what battle, but traditions are clashing with the new technology, just as it did hundreds of years ago. A warrior that has little care for fame or status fights to eliminate those outside the cities looking to intervene on citizens lives. With no care for the clash of traditions, only the care to fight for humanity and protect the cities fortitude. From a young age, the old samurai ways have been encoded into this man's mind, making the way he fights strongly resemble those of old tradition."}, {"id": "gary", "title": "Gary Ashward the Skeleton Knight", "cls": "Shadow Knight", "role": "Tank", "slot": "Tank 2", "range": 1, "energy": "Rage", "color": "#7b5ea7", "atk": [2, 3, 4, 4, 5], "mov": [2, 2, 3, 3, 3], "def": [3, 3, 4, 5, 6], "hp": [20, 25, 30, 35, 40], "ability": "Use 2 rage to avoid all damage incoming for the one round, can only use once per room clear", "bg": "Once a noble knight commander in the kingdom of camelot, this knight fought bravely in the Great Battle of Camelot, but after the battle was over a curse took over his body, turning him into a monster that he once fought against. Becoming the undead, he was outcast. For 150 years he has traveled the world fighting the battles for humanity behind the scenes, for his mental state was never corrupted by the curse. Always ready for a battle, never fighting against humanity, this knight is as honorable as they come."}, {"id": "kaelen", "title": "Kaelen the Knight of Humanity", "cls": "Cryomatic Knight", "role": "Melee", "slot": "Melee 1", "range": 1, "energy": "Cryions", "color": "#4fa3d1", "atk": [4, 4, 5, 5, 6], "mov": [3, 3, 4, 4, 5], "def": [2, 2, 3, 3, 3], "hp": [15, 20, 25, 30, 35], "ability": "Ice Relay uses 2 Cryions to blast target within 3 spaces with an electric ice circuit, attacking for base attack +1.", "bg": "Crafted from metal and ancient cryo-magic this sentient robotic knight uses its ancient magic intelligence to fight the corruption spreading in the cities in 2112 A.C. As technology mixed with magic infiltrates people's cognitive function, enraging to weak to turn against the rest. Freezing the corruption once the corrupted has been slayed, none knowing the true nature of the heroes humanity. Humanity gets blurred once this cryotic soldier fights humanity for the sake of preserving humanity. Never being programmed and never being taught, what is the true upholding behind his humanity?"}, {"id": "vane", "title": "Vane the Nightfall Reaper", "cls": "Void Assassin", "role": "Melee", "slot": "Melee 2", "range": 1, "energy": "Void Energy", "color": "#5b4a8a", "atk": [4, 5, 6, 7, 8], "mov": [4, 5, 5, 6, 7], "def": [1, 1, 1, 2, 2], "hp": [15, 20, 25, 30, 35], "ability": "(Passive) All first attacks on the target avoid the defense and do 1 extra attack damage.", "bg": "Assassins have always been a term used negatively, but an assassin that works without spilt blood to hunt creatures lurking in the voids between the shadow realm and the humans. Never hunting humans for others prowess, but instead to hunt those waiting to feed on humanities ignorance. Taught from the experience of his family dying by the hands of the voidwalkers, Vane believes that it's his calling to seek vengeance for his family and protect others in his position. Nobody knows he exists, or what he does, and none knows his name, but this hunter of shadow demons is a hero in his own right."}, {"id": "vyronica", "title": "Vyronica Sentarian of Zenarithil", "cls": "Elemental Mage", "role": "Ranged", "slot": "Ranged 1", "range": 3, "energy": "Mana", "color": "#d9822b", "atk": [4, 5, 5, 6, 7], "mov": [4, 4, 5, 5, 5], "def": [1, 1, 1, 2, 2], "hp": [12, 15, 20, 25, 30], "ability": "A Fire cascade envelops the user, Attack base damage to all enemies adjacent along with base -2 self damage", "bg": "Vyronica is a human that lived in the early 13th century at a whichcraft school for all types of magic, hidden away deep in the Alarctic mountains. Proficient in many different types of elemental magic, this mage only wants to help others learn the craft and advance their abilities to serve different human empires. These mages work to keep the peace between nations, but Vyronica hasn’t gone into the world to work with other humans and takes time studying all types of elemental magic. Ready for a catastrophe, but never knowing the reason behind her curiosity for destruction magic."}, {"id": "sylas", "title": "Sylas Everglade the Verdant Apex", "cls": "Solar-Vein Marksman", "role": "Ranged", "slot": "Ranged 2", "range": 4, "energy": "Energy", "color": "#5fa04e", "atk": [3, 4, 5, 5, 6], "mov": [3, 3, 4, 4, 4], "def": [2, 2, 3, 3, 3], "hp": [15, 20, 25, 30, 35], "ability": "For 1 energy, use any ranged Base Attack to fire at 2 enemies at once. (Doesn’t gain energy on attack)", "bg": "2430 A.C, after a spacecraft collided with the planet and brought both new allies and enemies to the world. The Solar-Vein’s arrival on earth was a turning point as we now know another species in the universe exist. Coming to our planet to seek refuge from the Crimson Tempest’s abundant army and militia. Learning that humans and Solar-Vein have the same god and similar biology, but different points in technological evolution, they banned together creating an alliance to hold off the Crimson tempest’s reign. A crossbreed, Sylas Everglade, an honorable warrior idealized a new technology based on long lost Marksman techniques, brought a new age of battle to not just hold off the Crimson Tempest, but retaliate, Leading as the Verdant Apex Marksman."}, {"id": "elizabeth", "title": "Elizabeth Cyllene the Moon Priestess", "cls": "Divine Moon Priestess", "role": "Healer", "slot": "Healer 2", "range": 2, "energy": "Lunar Energy", "color": "#8fb4d9", "atk": [3, 3, 4, 5, 6], "mov": [2, 3, 3, 4, 4], "def": [1, 1, 1, 2, 2], "hp": [10, 14, 17, 22, 25], "ability": "Use 2 Lunar energy to heal another hero for 7 hp during Skill action, and dispels any effects on target", "bg": "Worshiping the moon Goddess Selene, Elizabeth has transcended through time as the inherited disciple of Selene. Inheriting the essence of the moon priest has bestowed holy remedies that have been known throughout time as miracles. Only called upon when needed, this priestess has never considered her actions truly good enough for humanity as the moon Goddess Selene has mysterious ways. Elizabeth’s only wish is to truly act as an important part of something greater, even if she isn’t remembered for it. To satisfy her dying mothers wish for her to help all that she can, in the time she is given, with the abilities she possesses.", "healBase": true}, {"id": "aurelia", "title": "Aurelia Montreli the Radiant Sunweaver", "cls": "Solar Cleric", "role": "Healer", "slot": "Healer 2", "range": 2, "energy": "Solar Energy", "color": "#e3b04b", "atk": [3, 3, 4, 4, 5], "mov": [2, 3, 3, 4, 4], "def": [1, 1, 2, 2, 2], "hp": [12, 16, 22, 26, 30], "ability": "Use 2 mana as a skill action to increase another hero’s attack by 1 until room cleared", "bg": "Born in the cliffside monastery of Solis-under-the-Peaks, unknown as to when in the asterial calendar, Aurelia was chosen as her generation’s Radiant Sunweaver after demonstrating a rare, instinctual connection to ancient sacred texts and solar prana. In her ancestral scripture, Sunweaving is the spiritual art of channeling solar energy into physical form meant to ward off demonic entanglement. Supported by her fellow monastics, she now ventures beyond the sanctuary, wielding the sacred Sun Staff and codex to bring the mountain's holy radiance into the world's darkest corners, enriching the lives of many needing protection from the darkness in our hearts that comes from sin."}];</script>

          <tr><td>4</td><td style="text-align:left">Crystal Husks (placeholder: golem cards, scaled up)</td><td style="text-align:left">Not defined yet</td></tr>
          <tr><td>5</td><td style="text-align:left">??? Roll 1-4 per room for the enemy type, then the Chronoshard Warden</td><td style="text-align:left">Not defined yet</td></tr></table></div>
          <h2 style="margin-top:14px">Room sizes</h2><div class="scroll"><table class="stbl"><tr><th>Room</th><th>Goblins</th><th>Elites</th><th>Golems</th><th>Elites</th></tr>${[0, 1, 2, 3, 4].map(i => `<tr><td>${i + 1}</td><td class="num">${E.ROOM_TABLE[i][0]}</td><td class="num">${E.ROOM_TABLE[i][1]}</td><td class="num">${E.ROOMS_GOLEM[i] ? E.ROOMS_GOLEM[i][0] : '-'}</td><td class="num">${E.ROOMS_GOLEM[i] ? E.ROOMS_GOLEM[i][1] : '-'}</td></tr>`).join('')}<tr><td>Boss</td><td class="num">2</td><td>+ Baron</td><td class="num">2</td><td>+ Colossus</td></tr></table></div>
          <p class="dim">Enemies spawn on a rolled side that is not the entry side or next to it.</p></section></div>
      <section class="panel"><h2>Enemy stat cards</h2><p class="dim">Difficulty picks the rank. Goblins use your stat cards. Golems are tankier (more HP and defense) with a slightly stronger attack. Bosses have their own stats.</p>
        <div class="scroll"><table class="stbl" style="min-width:620px"><tr><th style="text-align:left">Enemy</th><th>Rank I · Easy</th><th>Rank II · Medium</th><th>Rank III · Hard</th></tr>
          ${[[1, 'minion', 'Goblin'], [1, 'elite', 'Elite Goblin'], [1, 'boss', 'Goblin Baron'], [2, 'minion', 'Golem'], [2, 'elite', 'Elite Golem'], [2, 'boss', 'Cavern Colossus']].map(([d, t, n]) => `<tr><td style="text-align:left">${n}</td>${E.ENEMY_SETS[d].ranks[t].map(r => `<td class="num">${r[0]} HP · ${r[1]} atk · ${r[2]} def</td>`).join('')}</tr>`).join('')}</table></div></section>
      ${[['goblin', 'Goblin attack deck (50 cards)', 'One card is drawn per enemy action. The enemy moves toward the closest hero holding a token in the card range, then attacks for its attack stat plus any bonus. Special cards add one extra move and hit up to two adjacent heroes.'], ['golem', 'Golem attack deck (50 cards)', 'Same rules. 30 of the cards are elemental (fire, frost, storm, stone) and ranged, so golems can hit from across the room.'], ['boss:goblin', 'Goblin Baron special moves (12 cards)', 'The Baron draws only from this deck. Summons, heals, enrage, area attacks, staggers and burns.'], ['boss:golem', 'Cavern Colossus special moves (12 cards)', 'The Colossus draws only from this deck. Same kinds of moves, with elemental attacks.']].map(([k, title, blurb]) => `
      <section class="panel"><h2>${title}</h2><p class="dim">${blurb}</p>
        <div class="scroll"><table class="stbl" style="min-width:560px"><tr><th>#</th><th style="text-align:left">Card</th><th>Type</th><th>Tokens</th><th>Move</th><th style="text-align:left">Effect</th></tr>
          ${E.CARD_SETS[k].map(c => `<tr><td class="num">${c.num}</td><td style="text-align:left">${esc(c.name)}${c.element ? ' <span class="chip">' + c.element + '</span>' : ''}</td><td>${c.type}${c.special ? ' · special' : ''}</td><td class="num">${c.pool}</td><td class="num">${c.move}${c.extra ? '+' + c.extra : ''}</td><td style="text-align:left;font-size:.85rem">${k.startsWith('boss') ? esc(c.text) : (c.special ? 'x2 adjacent' : c.bonus ? 'atk +' + c.bonus : 'atk')}</td></tr>`).join('')}</table></div></section>`).join('')}
      <section class="panel"><h2>Loot, gear and the Selection room</h2><ul>
        <li><b>Drops.</b> Every Elite has a 25% chance to drop one piece of gear, and every Boss drops one for each 4 heroes (always at least one). Loot goes into a shared pool. Gear strength depends on the dungeon level, and bosses drop Fine or better. Difficulty only caps the best rarity: Easy gear tops out at Fine, Medium at Rare, and Hard and above can reach Epic. Shop prices follow what you earn on that difficulty, so gear stays a small, steady boost.</li>
        <li><b>Slots.</b> Each hero wears 1 weapon, 1 helm, 1 armor and 1 special item. Weapons and armor are made for melee heroes (Tanks, Melee) or casters (Ranged, Healers). Weapons give attack, helms and armor give health and defense, and Fine or better gear carries a special ability. Special items are all ability.</li>
        <li><b>Quality.</b> Items are Common, Fine, Rare or Epic, and every stat and ability grows with the dungeon level they drop in (Level 1 to 10 and beyond in Continuous mode).</li>
        <li><b>Selection room.</b> After every room (before the next one) the party meets in the Selection room. Give loot to heroes, let each hero meditate once for +1 energy, and reorder turns. Unassigned loot stays in the pool until you hand it out or discard it.</li>
        <li><b>Soulbound.</b> Equipped gear is bound to that hero and cannot be traded. Equipping a better item in an occupied slot destroys the old card. An item that is not better than what the hero wears cannot be equipped.</li>
        <li><b>Balance.</b> Gear is deliberately small (about +1 to +4 attack, +1 to +10 health), and enemies grow slightly tougher the more gear the party carries, so a room takes about as long as it did before loot existed.</li>
        <li><b>Abilities.</b> Weapons: Keen Edge (first attack ignores defense), Siphon, Sweeping Strike, Capacitor. Helms and armor: Warding, Thornweave, Mending, Fleet, Attuned. Special items: Rebirth, Fortune, Radiance, Rally, Hunter's Eye.</li></ul>
        <div class="scroll"><table class="stbl" style="min-width:760px"><tr><th style="text-align:left">Ability</th><th>Fits</th><th style="text-align:left">Fine, Level 1</th><th style="text-align:left">Rare, Level 5</th><th style="text-align:left">Epic, Level 10</th></tr>${Object.entries(E.GEAR.AB).filter(([k]) => k !== 'legend').map(([k, a]) => { const c = (L, r) => (L >= (a.minL || 0) && r >= (a.minR || 0)) ? esc(a.text(a.v(L, r))) : '<span class="dim">not found this early</span>'; return `<tr><td style="text-align:left"><b>${esc(a.name)}</b></td><td>${a.slots.map(x => E.GEAR.SLOTS[x].name).join(' / ')}</td><td style="text-align:left">${c(1, 1)}</td><td style="text-align:left">${c(5, 2)}</td><td style="text-align:left">${c(10, 3)}</td></tr>`; }).join('')}</table></div></section>
      <section class="panel"><h2>Last-resort roll</h2><p class="dim">Melee heroes (Kenji, Gary, Kaelen, Vane) have a last-resort roll: whenever a hit would take them down, there is a 25% chance they roll clear and take no damage at all.</p></section>
      <section class="panel"><h2>Gold, shop, inventory and potions</h2><ul>
        <li><b>Gold.</b> Every kill pays gold to the whole party: Minion 2, Elite 6, Boss 20, multiplied by the level (+30% per level), the difficulty (Easy ×1, Medium ×1.5, Hard ×2.25, Very Hard ×3.4, Impossible ×5) and golems (×1.2). Enemies that are summoned during a fight pay nothing. <b>Selling:</b> unequipped gear in your bag can be sold from the Inventory for 40% of its shop price, so it grows with the item's level, rarity and slot (legendary weapons sell for 🪙 800 and legendary gear for 🪙 200). Equipped gear cannot be sold.</li>
        <li><b>The shop.</b> When a boss falls a merchant sets up a stall next to the Chronoshard. It sells weapons, helms, armor and special items (better and better each level), plus potions. Some potions only appear in later levels: Stoneskin from level 2, Fury Tonic and Greater Healing from level 3, Phoenix Tonic at level 5. Each potion is limited to 3 per visit.</li>
        <li><b>Inventory.</b> The Inventory button sits at the bottom of the screen. Pick a piece of gear and then the hero who gets it. If it replaces something, the old piece is destroyed. Equipped gear is soulbound.</li>
        <li><b>Potions.</b> Any hero can use a potion on any turn. In battle it costs 1 action. They are cheap and modest: Healing Potion 6 HP, Greater Healing 14 HP, Focus Draught +2 energy, Stoneskin 3 less damage per hit until your next turn, Fury Tonic +2 attack for the room, Phoenix Tonic raises a downed hero at half health.</li>
        <li><b>Wiped out.</b> If every hero falls, the party wakes in a quiet room with no enemies and one merchant. Spend your gold, then return to the start of the level (full health, gold, gear and potions kept). Kills are worth 25% less on each retry of the same level, down to 30%. This is how even Impossible can be improved on.</li>
        <li><b>Loadout slots.</b> There are three named gear slots, chosen on the setup screen. The selected slot is equipped onto your heroes when you start, and your gear and potions are saved back into it after every boss and after a victory (you can also press Save in the Inventory). Click a slot's name to rename it. Impossible is practically impossible without gear from earlier difficulties.</li></ul></section>
      <section class="panel"><h2>Legendary weapons</h2><p class="dim">Every hero has one legendary weapon, and every shop keeps them sealed until your save slot has recovered <b>${E.SHOP.LEGEND_SHARDS} Chronoshards</b> in total. Each boss you defeat gives one, in any mode, and they add up across runs, so it takes about two full Campaign runs (or one long Continuous run). Once the seal breaks, each shop sells every hero's legendary weapon, so you choose which to buy (nothing is left to chance). They all cost the same flat 🪙 2000, at every level and difficulty. Clearing Hard (all 5 dungeons) also unlocks <b>legendary gear</b> in the shop, strong helms, armor and trinkets at 🪙 500 each. Gold, potions, gear and Chronoshards are saved in the slot you picked, so you can save up over several runs.</p><p class="dim">A legendary weapon has two separate parts. Its <b>weapon stats</b> are fixed and always on (different for each hero). Its <b>legendary skill</b> is a second ultimate that only works while that hero wields it: 4 energy, once per room. The skill's numbers are listed below at level 1 and grow by 20% per level up to level 10, then 5% more per level up to level 16, so it stays useful from Dungeon 1 to the deepest Continuous level. To keep things fair, enemies gain +6% HP for each hero wielding one (+10% in Continuous mode).</p>
        <table class="systbl"><thead><tr><th>Hero</th><th>Weapon</th><th>Weapon stats</th><th>Legendary skill (level 1)</th></tr></thead><tbody>${Object.keys(E.GEAR.LEGENDARY).map(id => `<tr><td>${esc(first(hd(id)))}</td><td style="text-align:left">${esc(E.GEAR.LEGENDARY[id].name)}</td><td style="text-align:left">${esc(E.GEAR.statText(E.GEAR.legendary(id, 0)))}</td><td style="text-align:left"><b>${esc(E.GEAR.LEGENDARY[id].skill)}.</b> ${esc(E.SKILLDEFS.LEGEND[id].text(null, null, 1))}</td></tr>`).join('')}</tbody></table></section>
      <section class="panel"><h2>Room modifiers</h2><p class="dim">Every room rolls modifiers by difficulty. Easy: 1 (mostly boons). Medium: 1 boon + 1 curse (+1 curse in the Boss Room). Hard: 2 curses, a boon only 1 time in 3 (+1 curse in the Boss Room). Very Hard: 3 curses (4 in the Boss Room). Impossible: 4 curses (5 in the Boss Room). Medium and up can also place a Heal Crystal, and each Boss Room holds a Chronoshard behind the enemy lines that you collect when the boss falls.</p>
        <div class="scroll"><table class="stbl" style="min-width:560px"><tr><th style="text-align:left">Modifier</th><th>Type</th><th>Inspired by</th><th style="text-align:left">Effect</th></tr>${Object.values(E.MODS).map(m => `<tr><td style="text-align:left"><b>${esc(m.name)}</b></td><td>${m.good ? 'Boon' : 'Curse'}</td><td>${esc(m.src)}</td><td style="text-align:left">${esc(m.text)}</td></tr>`).join('')}</table></div></section>
      <section class="panel"><h2>Legendary gear and healer gear</h2><p class="dim" style="margin:0"><b>Legendary gear.</b> Once a save file has cleared Hard (or higher) through all 5 dungeons, every shop also sells strong legendary helms, armor and trinkets for 🪙 ${E.SHOP.LEGGEAR_PRICE} each. Anyone who can wear that slot may use them. Legendary weapons (one per hero) cost 🪙 2000 each. <b>Healer gear.</b> If your party has a Healer, every shop sells healer-only gear at every level, and enemies can drop it too: <i>Healing Light</i> adds extra HP to every heal, <i>Wellspring</i> also heals allies next to the one you heal, and <i>Mercy</i> heals your most wounded ally at the start of your turn. Only Healers can wear it.</p></section>
      <section class="panel"><h2>Stacking buffs</h2><p class="dim" style="margin:0">Buffs stack with each other and with themselves. Damage reduction adds up (two Ice Armors, a ward potion and a party veil all count), regeneration adds up, thorns add up, attack bonuses add up, and “next attack” bonuses add on top of attack bonuses, Bless and the rest of the room modifiers. Shields still just protect you from all damage until your next turn.</p></section>
      <section class="panel"><h2>Changing your party</h2><p class="dim" style="margin:0">After every boss (Campaign and Continuous) the level-up screen has a <b>Change party</b> button. Remove heroes or add up to 8, so you can start with 4 and bring in more companions if the catacombs get hard. A new companion joins at the party's level and picks all their skill cards for it. After a wipe the quiet room has the same button, and the save file screen has <b>Change party, then continue</b>. Gear is permanent to its hero: it never transfers, a hero who leaves keeps their gear in the save, and it is back when they rejoin.</p></section>
      <section class="panel"><h2>Very Hard and Continuous mode</h2><ul><li><b>Very Hard.</b> Built for 8 heroes. Rooms hold up to 14 enemies drawn from several enemy types at once, each with +50% health, +2 attack and +1 defense on top of Rank III. Fewer than 8 heroes is a losing fight by design.</li>
        <li><b>Impossible.</b> The same horde idea pushed further: enemy strength is tuned to your party size and rises every level (4 heroes are wiped out in level 1, 6 fall around level 3, 8 can get about as far as level 5), with up to 16 enemies and a healing crystal in every room. Only Impossible works this way.</li>
        <li><b>Continuous.</b> There is no difficulty setting. The dungeon is one connected catacomb: when a room is cleared, the door on the far side opens (always in a different direction) onto a short corridor and the next room, which you can already see. Everyone moves 5 hexes at a time, freely, until the first hero steps into the new room; only then do its sleeping enemies wake and attack. Every 5th room is a boss room that gives a Chronoshard, a new skill card for every hero (full heal, one more level) and a save point. If the party falls it wakes in the quiet room and can return to the last boss checkpoint, keeping its gold, gear and potions. The climb is steady: Easy at the start, Very Hard by room 15 (it needs real gear), Impossible from room 25 (it needs a legendary weapon or two) and the final boss, the Chronoshard Warden, waits in room 30. Beyond it the enemies keep growing without end, with random surges and ever bigger rooms. Every room mixes the enemy types unlocked so far, and each enemy plays from its own deck. Heroes level up every 5 rooms (levels 6 and up extend each hero's stat growth) and all 8 skill cards are yours by level 8.</li>
        <li><b>Achievements.</b> Each boss clear records enemies killed, damage, best hit, healing, skills used and damage taken for every hero. The main menu has an Achievements panel with the totals.</li></ul></section>
      <section class="panel assume"><span class="tagA">Assumed for testing</span><h2>Things the docs left open</h2><ul>
        <li>Enemy cards name an initiative group (1-4, 5-7 or 8), with 1-4 on most cards. An enemy attacks the closest hero in the group, and if several are equally close, the hero with the lowest initiative number is attacked first.</li>
        <li><b>Interception (Kenji and Gary).</b> When an enemy that is adjacent to a tank is about to make a single-target attack on a back-line hero (any Ranged or Healer), the game pauses and asks that tank whether to spend 1 energy to intercept. If yes, the tank steps in and takes the hit instead for half of the original damage (rounded up) and still rolls to block. If no, the attack goes ahead as normal.</li>
        <li>The defense die is a d6. Heroes block on 4 or higher (3 in 6, with a Lucky Die 3 or higher); enemies block only on 5 or higher (2 in 6).</li>
        <li>Ranged attacks have no range limit, for heroes (Ranged and Healer classes) and for enemy ranged cards. Melee attacks need an adjacent target. Skill cards state their own reach, such as 3 hexes for Dash and Slash or adjacent for cleaves.</li>
        <li>Skill decks are new for this build: 8 cards per hero, 64 in all, with costs from 2 to 5 energy. The setup screen can switch to All unlocked, which gives every hero their whole deck from Level 1 for testing.</li>
        <li>Skills no longer apply damage over time or lasting effects to enemies. Every skill is instant damage, healing or a buff. Buffs: damage reduction until your next turn, a bigger next attack, extra actions, and taunts. Guard effects on heroes last until that hero's next turn.</li>
        <li>Dungeon 3 and 4 are placeholders scaled up from the goblin and golem stats, and the final dungeon rolls the enemy type per room. Boss stats, the golem stats and the boss move decks are first drafts for testing. A summoned minion needs fewer than 4 enemies alive. Room modifiers are original rules inspired by Baldur's Gate 3 and Gloomhaven. Heal Crystals (Medium and up) are an attackable object that heals the enemy acting each turn</li>
        <li>Skill cards show values at Lv 1, 3 and 5. Heroes at Lv 2 use the Lv 1 value and heroes at Lv 4 use the Lv 3 value.</li>
        <li>Skill damage can be blocked unless the card says unblockable or ignores defense. Dash and Slash: the samurai takes the shortest free route (up to 3 steps) to a hex next to the target. Enemies adjacent to that route take 1 damage.</li>
        <li>Taunts (Hollow Challenge, Ember Challenge, Undying Grudge) override the card's target but the card still sets movement and attack bonus. Each enemy action uses up one turn of the taunt. Hollow and Ember Challenge last 7 enemy turns at Level 1, then 8, 9, 11, 13 (and 15, 17, 19, 21, 24 in Continuous mode). Undying Grudge lasts 3, 4, 5, 6, 8. A taunt ends at the start of the next room.</li>
        <li>Healing cannot revive a downed hero until the boss is beaten. Special abilities cost 2 energy (Twin Shot does not gain energy). Revive skills raise a downed hero at once, in the middle of a room.</li>
        <li>Healers can also use a basic Heal action for their base number. Elizabeth's Heal Base is also used as her attack.</li>
        <li>One enemy acts after each hero turn by default. Switch to after each action in the setup screen.</li>
        <li>Each room is one hex tile of 37 spaces, and the Boss Room uses a 61-space tile. The 15 gameplay tiles and edge-matching are not modeled yet.</li>
        <li>Initiative defaults follow the recommended split for the party size. You can reassign tokens before starting.</li></ul></section></div>`;
  }

  /* ---------- play: setup ---------- */
  function ensurePicks() { S.party.forEach(id => { const all = E.SKILLDEFS.DEFS[id].cards.map(c => c.id); let p = (S.picks[id] || []).filter(x => all.includes(x)).slice(0, S.startDungeon); for (const c of all) { if (p.length >= S.startDungeon) break; if (!p.includes(c)) p.push(c); } S.picks[id] = p; }); }
  function deckPicker() { ensurePicks();
    return `<div><div class="eyebrow">Skill cards for each hero</div><p class="dim" style="margin:4px 0 10px">${S.startDungeon === 1 ? 'Pick your Level 1 skill card.' : 'Pick ' + S.startDungeon + ' skill cards, one for each level up to your starting level.'} You pick one more every time you level up. Special abilities are always yours.</p>
      ${S.party.map(id => { const hd_ = hd(id); const lvl = S.startDungeon; return `<div class="deckrow"><b>${esc(first(hd_))}</b><div class="deckcards">${E.SKILLDEFS.DEFS[id].cards.map(c => `<button class="deckcard" data-deck="${id}:${c.id}" aria-pressed="${S.picks[id].includes(c.id)}"><b>${esc(c.name)}</b><span class="dim">${c.cost} ${esc(hd_.energy)} · ${c.tag}</span><span>${esc(E.skillText(c, lvl))}</span></button>`).join('')}</div></div>`; }).join('')}</div>`; }
  function setupView() {
    ensurePicks();
    const n = S.party.length, used = new Set(Object.values(S.tokens));
    const missing = S.party.filter(id => !used.has(id));
    const bad = n < 1 || missing.length > 0 || (!S.unlockAll && S.party.some(id => (S.picks[id] || []).length < S.startDungeon));
    const sl0 = loadSlots();
    return `<div class="setup panel">
      ${S.mpSetup ? '<div class="filehead"><button class="btn tiny" data-mpact="lobby">← Multiplayer lobby</button><span><b>Multiplayer game</b> · hosted by you · not saved to a file</span></div>' : `<div class="filehead"><button class="btn tiny" data-act="backfiles">← Save files</button><span><b>${esc(slotName(sl0, activeSlot()))}</b> · new world in file ${activeSlot() + 1}</span></div>`}
      <div><div class="eyebrow">Step 1</div><h2>Choose your heroes</h2><p class="dim" style="margin:4px 0 10px">Recommended for four players: 1 tank, 2 damage dealers, 1 healer. Up to eight. You control every hero in this test.</p>
        <div class="pick">${HEROES.map(h => `<button class="pickbtn" data-pick="${h.id}" aria-pressed="${S.party.includes(h.id)}"><img src="img/${h.id}.jpg" alt="" loading="lazy"><div><b>${esc(first(h))}</b><br><span class="chip ${h.role}">${h.slot}</span></div></button>`).join('')}</div>
        <p class="${n >= 4 ? 'dim' : 'warn'}" style="margin:8px 0 0">${n} hero${n === 1 ? '' : 'es'} selected${n < 4 ? '. The game is built for four or more, but you can test with fewer.' : '.'}</p></div>
      <div class="row"><div><div class="eyebrow">Game mode</div><div class="seg"><button data-gmode="0" aria-pressed="${!S.endless}">Campaign · 5 dungeons</button><button data-gmode="1" aria-pressed="${S.endless}">Continuous · endless</button></div></div>
        ${S.endless ? '' : `<div><div class="eyebrow">Difficulty</div><div class="seg">${Object.entries(E.DIFFICULTY).map(([k, v]) => `<button data-diff="${k}" aria-pressed="${S.difficulty === k}">${v.label} · ${v.rankLabel}</button>`).join('')}</div></div>`}
        <div><div class="eyebrow">Enemy responds</div><div class="seg"><button data-mode="turn" aria-pressed="${S.mode === 'turn'}">After each hero turn</button><button data-mode="action" aria-pressed="${S.mode === 'action'}">After each action</button></div></div>
        <div><div class="eyebrow">Skill cards</div><div class="seg"><button data-unlock="0" aria-pressed="${!S.unlockAll}">Pick per level</button><button data-unlock="1" aria-pressed="${S.unlockAll}">All unlocked</button></div></div>
        ${S.endless ? '' : `<div><div class="eyebrow">Start at dungeon</div><div class="seg">${[1, 2, 3, 4, 5].map(d => `<button data-start="${d}" aria-pressed="${S.startDungeon === d}">${d}</button>`).join('')}</div></div>`}</div>
      ${S.endless ? '' : `<p class="dim" style="margin:0"><b>${esc(E.DIFFICULTY[S.difficulty].label)}:</b> ${esc(E.DIFFICULTY[S.difficulty].modInfo)}${S.difficulty === 'vhard' || S.difficulty === 'impossible' ? (n >= 8 ? (S.difficulty === 'impossible' ? ' Eight heroes with full decks and a lot of patience: just barely possible.' : ' Eight heroes: a fighting chance.') : ' <b class="warn">You have ' + n + ' heroes. This is built for 8; with fewer it cannot be won.</b>') : ''}</p>`}
      ${S.endless ? '' : S.difficulty === 'impossible' ? `<div class="warnbox"><b>⚠ Caution.</b> Impossible is practically impossible without gear from the earlier difficulties. Win Easy, then Medium, Hard and Very Hard first: your gear is saved in the selected loadout slot after every boss, and you can start the next run with it. Even then, expect to be wiped out often. The quiet room after a wipe lets you spend the gold you earned from kills and try again.</div>` : ''}
      ${S.endless ? '<p class="dim" style="margin:0"><b>Continuous:</b> there is no difficulty setting. The whole dungeon is one connected catacomb: clear a room and the door on the far side opens onto a corridor and the next room, with its enemies asleep until you step in. Every 5 rooms is a boss, a Chronoshard, a new skill card for every hero and a save point (if you fall, you wake in the quiet room and can return to the last boss checkpoint, gear kept). The climb is steady: Very Hard by room 15 (you will need gear), Impossible from room 25 (you will need a legendary weapon or two), and the final boss waits in room 30. After that the catacombs never stop growing, with random surges.</p>' : ''}
      ${S.unlockAll ? '' : deckPicker()}
      <div><div class="eyebrow">Step 2</div><h2>Initiative tokens</h2><p class="dim" style="margin:4px 0 10px">Enemies hunt tokens 1-4 most often, 5-7 less, and 8 rarely. The closest hero in the group is hit first, and ties go to the lowest token. Every hero needs at least one.</p>
        <div class="tokgrid">${[1, 2, 3, 4, 5, 6, 7, 8].map(t => `<label>Token ${t}<select data-tok="${t}">${S.party.map(id => `<option value="${id}" ${S.tokens[t] === id ? 'selected' : ''}>${esc(first(hd(id)))}</option>`).join('')}</select></label>`).join('')}</div>
        ${missing.length ? `<p class="warn" style="margin:8px 0 0">No token for ${missing.map(id => first(hd(id))).join(', ')}.</p>` : ''}
        <div class="row" style="margin-top:8px"><button class="btn" data-act="autotok">Auto-assign by role</button></div></div>
      ${S.mpSetup ? mpAssignPanel() : `<div><div class="eyebrow">Step 3</div><h2>Name your save</h2><p class="dim" style="margin:4px 0 8px">Required. The save name and your player name are shown on the Leaderboard with your total enemies killed, damage done and crystals obtained.</p><input class="slotname wname" data-wname maxlength="24" placeholder="Save name" value="${esc(S.wname || '')}" aria-label="Save name for the leaderboard" style="max-width:340px;margin:0 8px 8px 0"><input class="slotname" data-pname maxlength="24" placeholder="Your player name" value="${esc(lbPname())}" aria-label="Your player name" style="max-width:240px;margin-bottom:12px"></div>`}
